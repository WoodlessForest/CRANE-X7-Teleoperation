<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">CRANE-X7 teleoperation system overview</title>
<desc id="desc">ZED stereo camera and optional robot arms connect to a Linux computer. A Quest headset uses ADB reverse for TCP ports 8080 and 8765, and the same Wi-Fi network for default WebRTC video. Hand poses return to the computer. WebSocket video is a fallback. Robot control is disabled by default.</desc>
